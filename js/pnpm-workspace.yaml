overrides:
  vite@*: "catalog:"

# Refuse to resolve package versions published less than 3 days ago (minutes).
minimumReleaseAge: 4320

allowBuilds:
  esbuild: true
  workerd: true
  sharp: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vite-plus: 1.8.0
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - tsrs
  - "@tsrs/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"

# Vite+ selects Node from package.json; do not let pnpm override CI matrices.
runtimeOnFail: ignore
