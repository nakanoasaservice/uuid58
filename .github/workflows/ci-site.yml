name: CI (Site)

# Called from ci.yml when the PR touches files this job checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          working-directory: site
          cache: true
          run-install: false

      - name: Verify declared Node.js runtime
        run: node -e 'const expected = require("./package.json").devEngines.runtime.version; if (process.versions.node !== expected) throw new Error(`Expected Node ${expected}, got ${process.version}`)'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fmt, lint and type check
        run: vp check

      - name: Build
        run: vp build
