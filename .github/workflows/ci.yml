name: CI
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Decides which jobs to run from the files the PR changes. Each job lives
  # in its own ci-<name>.yml, so a change to one of those (for example a
  # Dependabot bump of setup-java) runs only that job. Changes under spec/
  # or to this file run every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.filter.outputs.spec }}
      js: ${{ steps.filter.outputs.js }}
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      java: ${{ steps.filter.outputs.java }}
      postgres: ${{ steps.filter.outputs.postgres }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      php: ${{ steps.filter.outputs.php }}
      ruby: ${{ steps.filter.outputs.ruby }}
      dart: ${{ steps.filter.outputs.dart }}
      nix: ${{ steps.filter.outputs.nix }}
      site: ${{ steps.filter.outputs.site }}
    permissions:
      pull-requests: read
    steps:
      # Uses the API instead of actions/checkout so that this file pins no
      # actions and Dependabot bumps never touch it (which would run everything).
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          echo "$files"
          all=false
          if echo "$files" | grep -qE '^(spec/|\.github/workflows/ci\.yml$)'; then
            all=true
          fi
          # set <job> <regex>: run <job> when any changed file matches.
          set_output() {
            if [ "$all" = true ] || echo "$files" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          set_output spec   '^(formal/|rust/|js/src/(alphabet|base58|errors)\.ts$|\.github/workflows/ci-spec\.yml$)'
          set_output js     '^(js/|\.github/workflows/ci-js\.yml$)'
          set_output go     '^(go/|\.github/workflows/ci-go\.yml$)'
          set_output python '^(python/|\.github/workflows/ci-python\.yml$)'
          set_output rust   '^(rust/|\.github/workflows/ci-rust\.yml$)'
          set_output java   '^(java/|\.github/workflows/ci-java\.yml$)'
          set_output postgres '^(postgres/|\.github/workflows/ci-postgres\.yml$)'
          set_output dotnet   '^(dotnet/|\.github/workflows/ci-dotnet\.yml$)'
          set_output php      '^(php/|\.github/workflows/ci-php\.yml$)'
          set_output ruby     '^(ruby/|\.github/workflows/ci-ruby\.yml$)'
          set_output dart     '^(dart/|\.github/workflows/ci-dart\.yml$)'
          # The flake builds the CLI from go/ and runs its tests, which read spec/.
          set_output nix      '^(go/|flake\.(nix|lock)$|\.github/workflows/ci-nix\.yml$)'
          # The site builds against js/ and reads spec/, so check it when those change too.
          set_output site   '^((site|js)/|\.github/workflows/ci-site\.yml$)'

  spec:
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    uses: ./.github/workflows/ci-spec.yml

  js:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    uses: ./.github/workflows/ci-js.yml

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/ci-go.yml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/ci-python.yml

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yml

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    uses: ./.github/workflows/ci-java.yml

  postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    uses: ./.github/workflows/ci-postgres.yml

  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    uses: ./.github/workflows/ci-dotnet.yml

  php:
    needs: changes
    if: needs.changes.outputs.php == 'true'
    uses: ./.github/workflows/ci-php.yml

  ruby:
    needs: changes
    if: needs.changes.outputs.ruby == 'true'
    uses: ./.github/workflows/ci-ruby.yml

  dart:
    needs: changes
    if: needs.changes.outputs.dart == 'true'
    uses: ./.github/workflows/ci-dart.yml

  nix:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    uses: ./.github/workflows/ci-nix.yml

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: ./.github/workflows/ci-site.yml

  actions-lock:
    uses: ./.github/workflows/ci-actions-lock.yml

  # The single required status check. Language jobs that were skipped
  # because the PR does not touch them count as passing.
  check:
    needs: [changes, spec, js, go, python, rust, java, postgres, dotnet, php, ruby, dart, nix, site, actions-lock]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
