name: CI
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - name: Run fmt, lint and type check
        run: vp check

      - name: Run tests
        run: vp test run

      - name: Build (also generates jsr.json)
        run: vp pack

      - name: Dry-run JSR publish
        run: vp exec jsr publish --dry-run
