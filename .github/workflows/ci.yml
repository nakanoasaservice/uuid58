name: CI
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Decides which language jobs to run from the files the PR changes.
  # Changes under spec/ or to this workflow run every job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.filter.outputs.spec }}
      js: ${{ steps.filter.outputs.js }}
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          echo "$files"
          all=false
          if echo "$files" | grep -qE '^(spec/|\.github/workflows/ci\.yml$)'; then
            all=true
          fi
          echo "spec=$all" >> "$GITHUB_OUTPUT"
          if [ "$all" = true ] || echo "$files" | grep -q '^js/'; then
            echo "js=true" >> "$GITHUB_OUTPUT"
          else
            echo "js=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$all" = true ] || echo "$files" | grep -q '^go/'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$all" = true ] || echo "$files" | grep -q '^python/'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  spec:
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check that spec/vectors.json is up to date
        run: python3 spec/generate_vectors.py --check

  js:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: js
          node-version: "24"
          cache: true

      - name: Run fmt, lint and type check
        run: vp check

      - name: Run tests
        run: vp test run

      - name: Build (also generates jsr.json)
        run: vp pack

      - name: Dry-run JSR publish
        run: vp exec jsr publish --dry-run

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The minimum version in go/go.mod, and the latest release.
        go-version: ["1.26", "stable"]
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Run fuzz tests briefly
        run: |
          go test -run='^$' -fuzz='^FuzzBytesRoundTrip$' -fuzztime=10s .
          go test -run='^$' -fuzz='^FuzzDecode$' -fuzztime=10s .
          go test -run='^$' -fuzz='^FuzzEncode$' -fuzztime=10s .

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          working-directory: python
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and format check
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Type check
        run: uv run mypy

      - name: Run tests (including spec/vectors.json conformance)
        run: uv run pytest

      - name: Build
        run: uv build

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  actions-lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify Actions lockfile
        run: gh actions-lock --verify

  # The single required status check. Language jobs that were skipped
  # because the PR does not touch them count as passing.
  check:
    needs: [changes, spec, js, go, python, actions-lock]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
