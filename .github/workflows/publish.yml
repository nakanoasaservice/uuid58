name: Publish

# Release the JavaScript package by pushing a js/v… tag:
#   1. Bump "version" in js/package.json and merge it into main.
#   2. git tag js/v1.2.3 <commit on main> && git push origin js/v1.2.3
on:
  push:
    tags:
      - "js/v*"

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC for JSR and npm trusted publishing / provenance
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag matches js/package.json and is on main
        run: |
          VERSION=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "js/v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match js/package.json version js/v$VERSION"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: js
          # No dependency cache in the release job, to rule out cache poisoning.
          cache: false

      - name: Run tests
        run: vp test run

      - name: Build (also generates jsr.json)
        run: vp pack

      - name: Publish to JSR
        run: vp exec jsr publish

      - name: Setup npm registry
        uses: actions/setup-node@v7.1.0
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --provenance --access public

  release:
    needs: publish
    runs-on: ubuntu-latest
    # The write token lives only in this job, which runs no project code.
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes
