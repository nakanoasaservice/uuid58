name: Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only a merged PR from this repository's own `release` branch publishes;
    # a fork's branch that happens to be named `release` does not.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'release' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC for JSR and npm trusted publishing / provenance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          # No dependency cache in the release job, to rule out cache poisoning.
          cache: false

      - name: Run tests
        run: vp test run

      - name: Build (also generates jsr.json)
        run: vp pack

      - name: Publish to JSR
        run: vp exec jsr publish

      - name: Setup npm registry
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish --provenance --access public

  release:
    needs: publish
    runs-on: ubuntu-latest
    # The write token lives only in this job, which runs no project code.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r .version package.json)
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Skipping release creation."
          else
            echo "Creating release for v$VERSION"
            gh release create "v$VERSION" --generate-notes
          fi
