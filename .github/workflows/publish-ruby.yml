name: Publish Ruby

# Release the Ruby gem by pushing a ruby/v… tag:
#   1. Bump VERSION in ruby/lib/uuid58/version.rb (and the uuid58 entry in
#      ruby/Gemfile.lock, via `bundle install`) and merge it into main.
#   2. git tag ruby/v1.2.3 <commit on main> && git push origin ruby/v1.2.3
#
# rubygems/release-gem is not used: it runs `rake release`, which creates and
# pushes its own v… tag and runs project code next to the credentials.
on:
  push:
    tags:
      - "ruby/v*"

permissions: {}

jobs:
  # Builds and tests without any publishing credentials.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.342.0
        with:
          ruby-version: ruby
          working-directory: ruby
          # No dependency cache in the release job, to rule out cache poisoning.
          bundler-cache: false

      - name: Install dependencies
        run: bundle install
        env:
          BUNDLE_FROZEN: "true"

      - name: Verify tag matches ruby/lib/uuid58/version.rb and is on main
        run: |
          VERSION=$(ruby -e 'require_relative "lib/uuid58/version"; print Uuid58::VERSION')
          LOCK_VERSION=$(sed -n 's/^    uuid58 (\(.*\))$/\1/p' Gemfile.lock)
          if [ "$GITHUB_REF_NAME" != "ruby/v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match ruby/lib/uuid58/version.rb version ruby/v$VERSION"
            exit 1
          fi
          if [ "$LOCK_VERSION" != "$VERSION" ]; then
            echo "::error::ruby/Gemfile.lock has uuid58 ($LOCK_VERSION), expected ($VERSION); run bundle install"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - name: Run tests
        run: bundle exec rake test

      - name: Build
        run: gem build uuid58.gemspec --output uuid58.gem

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gem
          path: ruby/uuid58.gem
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    # The OIDC token lives only in this job, which runs no project code.
    permissions:
      id-token: write # RubyGems trusted publishing
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: gem

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.342.0
        with:
          ruby-version: ruby

      - name: Configure RubyGems credentials (trusted publishing)
        uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Publish to RubyGems.org
        run: gem push uuid58.gem

  release:
    needs: publish
    runs-on: ubuntu-latest
    # The write token lives only in this job, which runs no project code.
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes
