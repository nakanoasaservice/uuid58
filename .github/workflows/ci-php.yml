name: CI (PHP)

# Called from ci.yml when the PR touches files this job checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version in php/composer.json, and the latest release.
        php-version: ["8.1", "8.5"]
    defaults:
      run:
        working-directory: php
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          # The library needs no extensions; disable the optional ones it
          # could otherwise come to rely on by accident.
          extensions: :gmp, :bcmath
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --no-interaction --no-progress

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests (including spec/vectors.json conformance)
        run: vendor/bin/phpunit
