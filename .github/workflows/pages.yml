name: Pages

# Builds site/ and deploys it to https://nakanoasaservice.github.io/uuid58/.
# The site imports the library from js/ and reads spec/, so changes there
# redeploy it too.
on:
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "js/**"
      - "spec/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: site
          cache: true
          run-install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run fmt, lint and type check
        run: vp check

      - name: Build
        run: vp build

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
