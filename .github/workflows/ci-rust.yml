name: CI (Rust)

# Called from ci.yml when the PR touches files this job checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled on the runner; no third-party action needed.
      - name: Install Rust (stable and MSRV)
        run: |
          rustup toolchain install stable --profile minimal --no-self-update \
            --component rustfmt,clippy --target thumbv7em-none-eabi
          rustup toolchain install 1.85 --profile minimal --no-self-update
          rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: Test (default features)
        run: cargo test --locked

      - name: Test (all features)
        run: cargo test --locked --all-features

      - name: Test (no default features)
        run: cargo test --locked --no-default-features

      - name: Build for a no_std target
        run: |
          cargo build --locked --target thumbv7em-none-eabi --no-default-features
          cargo build --locked --target thumbv7em-none-eabi --no-default-features --features alloc,uuid

      - name: Docs
        run: |
          cargo doc --locked --no-deps --all-features
          cargo doc --locked --no-deps --no-default-features

      - name: MSRV (Rust 1.85)
        run: |
          cargo +1.85 test --locked --all-features
          cargo +1.85 check --locked --no-default-features

      - name: Dry-run crates.io publish
        run: cargo publish --locked --dry-run
