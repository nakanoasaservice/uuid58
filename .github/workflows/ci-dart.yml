name: CI (Dart)

# Called from ci.yml when the PR touches files this job checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The minimum version in dart/pubspec.yaml, and the latest release.
        sdk: ["3.6", "stable"]
    defaults:
      run:
        working-directory: dart
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1.8.2
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run dart analyze
        run: dart analyze --fatal-infos

      - name: Run tests (VM)
        run: dart test

      # Integers are JavaScript doubles on the web; these prove the
      # arithmetic stays exact there.
      - name: Run tests (dart2js on Node.js)
        run: dart test -p node

      - name: Run tests (dart2js and dart2wasm in Chrome)
        run: dart test -p chrome -c dart2js,dart2wasm

      - name: Check package
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
